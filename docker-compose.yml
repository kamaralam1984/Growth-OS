services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Real service-to-service wiring — hostnames are the compose service
      # names below, resolved via Docker's internal DNS.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kvl_growthos?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # Generate a real secret for local/self-hosted use:
      #   openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your .env file, e.g. via: openssl rand -base64 32}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /api/health is being built by a parallel monitoring task and did not
    # exist yet as of this file being written — this points at its
    # documented contract (GET /api/health -> 200 healthy / 503 degraded).
    # If it isn't merged yet, swap the path back to "/" temporarily.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # Real uploaded-document persistence (src/lib storage read/write path)
      # so files survive a container recreate — mirrors .gitignore's
      # /storage/documents exclusion from version control.
      - storage_documents:/app/storage/documents

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kvl_growthos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  storage_documents:
