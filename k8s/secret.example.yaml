# TEMPLATE ONLY. Copy to secret.yaml, fill in real values, and NEVER commit
# secret.yaml (it should be gitignored — plain-YAML Kubernetes Secrets are
# only base64-ENCODED, not encrypted; treat them exactly like a .env file
# in terms of who can read them). Prefer a real secret manager (Sealed
# Secrets, External Secrets Operator + AWS/GCP/Azure/Vault, etc.) over a
# plain kubectl-applied Secret once "real" is the target, not just "valid."
#
# Every key here matches a real env var this app reads (see .env.example
# for the authoritative list and what each one unlocks) — nothing is
# invented for this file specifically.
apiVersion: v1
kind: Secret
metadata:
  name: kvl-growthos-secrets
  namespace: kvl-growthos
type: Opaque
stringData:
  # Real managed Postgres/Redis connection strings — see k8s/README.md for
  # why this repo doesn't ship in-cluster Postgres/Redis manifests.
  DATABASE_URL: "postgresql://user:password@your-managed-postgres-host:5432/kvl_growthos?schema=public"
  REDIS_URL: "redis://your-managed-redis-host:6379"
  # openssl rand -base64 32
  AUTH_SECRET: "REPLACE_ME"
  AUTH_URL: "https://your-real-domain.example.com"
  # openssl rand -hex 32 — one real key per domain (see .env.example), all
  # optional, but a feature honestly stays "not configured" without its key.
  AGENT_MEMORY_ENCRYPTION_KEY: ""
  INTEGRATION_TOKEN_ENCRYPTION_KEY: ""
  SECRETS_MANAGER_ENCRYPTION_KEY: ""
  WEBHOOK_SECRET_ENCRYPTION_KEY: ""
  TWO_FACTOR_SECRET_ENCRYPTION_KEY: ""
  # AI provider chain (src/lib/ai/fallback.ts) — all optional.
  ANTHROPIC_API_KEY: ""
  GROQ_API_KEY: ""
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""
