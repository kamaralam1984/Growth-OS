# Reference copy of the real nginx vhost for this app's production
# deployment on the shared VPS (srv1569796.hstgr.cloud). The live file lives
# at /etc/nginx/sites-enabled/growthos.kvlbusinesssolutions.com on that host
# — matching how the sibling kvltrack.kvlbusinesssolutions.com vhost is laid
# out (a real file directly in sites-enabled/, not a sites-available symlink,
# unlike this host's other unrelated domains). Keep this copy in sync if the
# live file is ever hand-edited (e.g. by `certbot --nginx` renewing/adjusting
# the SSL block).
#
# Proxies to 127.0.0.1:${APP_HOST_PORT} — the app container's published
# port, set in docker-compose.yml via APP_HOST_PORT in .env. 3030 was picked
# because a `ss -tlnp` survey of this VPS on 2026-07-16 showed everything
# else already in use in the 3000-3204 range.
#
# Initial state is HTTP-only; `certbot --nginx -d growthos.kvlbusinesssolutions.com`
# rewrites this file in place to add the SSL server block + HTTP->HTTPS
# redirect, exactly as it already did for kvltrack.kvlbusinesssolutions.com.

server {
    listen 80;
    server_name growthos.kvlbusinesssolutions.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
