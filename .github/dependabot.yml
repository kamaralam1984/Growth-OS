# Weekly automated dependency-update PRs — npm (this app's own
# dependencies/devDependencies) and github-actions (the action versions
# pinned in .github/workflows/*.yml, e.g. actions/checkout@v4).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch same-scope/low-risk updates into one PR instead of one PR per
      # package — real dependency churn (Radix/types packages bump often)
      # without flooding the PR queue.
      radix-ui:
        patterns:
          - "@radix-ui/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
