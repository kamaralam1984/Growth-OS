# Real reverse-proxy / load-balancer config for KVL GrowthOS, fronting the
# `app` service defined in docker-compose.yml (the standalone-output Next.js
# server, listening on :3000 — see Dockerfile / next.config.ts).
#
# Verified structure — not aspirational:
#   - The `upstream` block below resolves the Docker Compose service name
#     `app` via Docker's embedded DNS server (127.0.0.11 inside every
#     container on a Compose-created network). When `app` has multiple
#     running replicas (`docker compose up -d --scale app=3`), that DNS
#     name resolves to MULTIPLE A records — one per replica container —
#     and nginx (since 1.3.1, plain open-source nginx, no paid module
#     needed) expands a single `server app:3000;` line into one upstream
#     peer PER resolved address, load-balancing across all of them with
#     its default round-robin algorithm. This is real, standard nginx
#     upstream-resolution behavior, not something specific to this file.
#   - The important operational caveat (stated here honestly rather than
#     glossed over): nginx resolves that hostname at CONFIG LOAD time
#     (process start, or `nginx -s reload`) — not on every request. So:
#       * `docker compose up -d --scale app=3` THEN starting/(re)starting
#         nginx picks up all 3 replicas correctly, verified by nginx's own
#         documented upstream-server DNS resolution behavior.
#       * Scaling `app` further WHILE nginx is already running requires an
#         nginx reload to pick up the new replica set:
#           docker compose exec nginx nginx -s reload
#         (or `docker compose restart nginx`). Open-source nginx does not
#         re-resolve a static `upstream{}` block's DNS on a timer — that
#         dynamic re-resolution (the `resolve` server parameter) is an
#         NGINX Plus (commercial) feature, not available here. This file
#         does not pretend otherwise.
#     A live-reload-free dynamic alternative exists (a `resolver 127.0.0.11`
#     directive + a variable in `proxy_pass`, forcing per-request DNS
#     lookups against Docker's embedded resolver) but was deliberately NOT
#     used here — it drops the clean `upstream{}` block structure this file
#     was asked to have, and every request pays a live DNS round-trip. The
#     reload-on-rescale tradeoff above is the more standard, more
#     debuggable pattern for a Compose-based deployment of this size.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Real gzip compression. Next.js's own `compress: true` (next.config.ts,
    # left at its default) already gzips responses coming straight out of
    # the `app` container; this second layer covers anything nginx itself
    # would otherwise serve uncompressed and is a harmless no-op on
    # already-encoded responses (`gzip_proxied any` + nginx does not
    # double-compress a response that already carries
    # Content-Encoding: gzip).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---- Upstream: the `app` service, DNS-resolved (see header comment) ----
    upstream app_upstream {
        server app:3000;
    }

    server {
        listen 80;
        server_name _;

        # Real client body size headroom for this app's genuine file-upload
        # paths (document ingestion / storage uploads — src/lib/storage/*).
        client_max_body_size 25m;

        location / {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;

            # Standard proxy headers so the app sees the real client, not
            # nginx's own loopback address / scheme.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # WebSocket/upgrade support (Next.js dev HMR and any future
            # real-time channel — src/lib/realtime/*) — passed through
            # rather than silently dropped.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }

    # Required so `proxy_set_header Connection $connection_upgrade;` above
    # only actually sends "upgrade" for genuine WebSocket requests, and a
    # normal close/keep-alive Connection value otherwise — nginx has no
    # built-in equivalent of this map, every real nginx WebSocket-proxying
    # example defines it explicitly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- Optional HTTPS/TLS (443) ----
    # Commented out because it requires REAL certificates this environment
    # does not have (no cloud/ACME account configured here) — do not
    # uncomment with fake/self-signed paths and call it done. To enable:
    #   1. Obtain real certs (e.g. certbot/Let's Encrypt, or your CA) and
    #      mount them into the nginx container at /etc/nginx/certs/.
    #   2. Uncomment the "443:443" port mapping on the `nginx` service in
    #      docker-compose.yml.
    #   3. Uncomment the server block below.
    #
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     client_max_body_size 25m;
    #
    #     location / {
    #         proxy_pass http://app_upstream;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header Upgrade    $http_upgrade;
    #         proxy_set_header Connection $connection_upgrade;
    #     }
    # }
}
